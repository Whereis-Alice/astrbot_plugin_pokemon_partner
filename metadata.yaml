name: "astrbot_plugin_pokemon_partner"
display_name: "宝可梦图鉴"
short_desc: "宝可梦抽卡收藏 + 中文图鉴查询 + 能力值/对战分析 + 冠军赛数据"
desc: "面向 AstrBot 的宝可梦插件：每日按配置概率抽取宝可梦，按群隔离收藏、闪光个体、星尘兑换与排行，并在抽卡卡片中显示官方立绘与详细资料；同时内置 pokemon-dataset-zh 中文图鉴库（1025 只宝可梦 + 295 个形态、特性、招式、道具、24 个地区图鉴与基准属性表），支持指令、LLM 工具、Pillow 卡片、能力值计算、属性相性、对战模拟、队伍分析、冠军赛查询与 Dashboard 管理台。除可配置的 PokéAPI 补充和立绘下载外，全部功能离线可用。"
version: "v1.3.5"
author: "Whereis-Alice"
repo: "https://github.com/Whereis-Alice/astrbot_plugin_pokemon_partner"
homepage: ""
license: "MIT"
tags:
  - "宝可梦"
  - "pokemon"
  - "抽卡"
  - "图鉴"
  - "游戏"
astrbot_version: ">=4.16,<5"
features:
  - "今日宝可梦：每次固定数量、四档稀有度概率、SSR 保底、新宝可梦保底、冷却与每日次数全部可配置"
  - "收藏与养成：图鉴进度、闪光个体、重复折算星尘、星尘定向兑换、收集里程碑奖励与群排行"
  - "主题卡片：保留原版精灵球圆盘、彩色能力条与图鉴阅读层级，森林、冰晶、紫晶舞台、黑金浮雕、珍珠全息五种场景和材质"
  - "TCG 收藏卡面：配置切换，黄边纸卡、银边反闪、全图彩箔、金箔蚀刻、珍珠虹彩星面与属性能量图标"
  - "宝可梦挑战：已持有图鉴编号或名字直接选择，群友接收即开战，可约定回合上限，卡片/转发/文本战报与胜负记录"
  - "立绘缓存：抽卡前自动预取，闪光优先真实异色图并独立缓存；管理员可一键补齐普通官方立绘"
  - "Dashboard 管理台：精灵球主题研究站、立绘图鉴、网格/列表切换、会话收藏导出、在线配置与失败回滚"
  - "本地中文图鉴查询：编号/名称/形态名，1025 种族 + 295 形态"
  - "LLM 原子工具：图鉴、特性、招式、道具、性格、相性、克制、配招、对战、队伍、冠军赛与宝可梦系统"
  - "能力值与对战：官方公式、25 种性格、招式效果与完整回合战报、种子复盘"
  - "冠军赛数据：排名/配置/道具反查/跨赛季趋势，本地 SQLite 只读，独立脚本抓取"
  - "可配置关闭 PokéAPI；关闭后纯离线运行"
keywords:
  - pokemon
  - 宝可梦
  - 抽卡
  - 图鉴
  - 对战模拟
  - 冠军赛
pages:
  - name: partner-console
    title: 宝可梦图鉴管理台
    description: 查看图鉴、管理群友数据、调整抽取规则与概率。
