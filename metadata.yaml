name: "astrbot_plugin_pokemon_partner"
display_name: "宝可梦伙伴图鉴"
short_desc: "宝可梦抽卡收藏 + 中文图鉴查询 + 能力值/对战分析 + 冠军赛数据"
desc: "面向 AstrBot 的宝可梦伙伴插件：每日按配置概率召唤伙伴，收集图鉴、闪光个体、星尘兑换与群排行；同时内置 pokemon-dataset-zh 中文图鉴库（1025 只宝可梦 + 295 个形态、特性、招式、道具、24 个地区图鉴与基准属性表），支持指令与 LLM 工具查询、Pillow 图片卡片、等级能力值、双向属性相性、克制推荐、招式表与配招校验、回合制对战模拟、队伍分析、种族值筛选、许愿星基拉祈筛选，以及可选的 Champions 冠军赛本地数据库查询。除可配置的 PokéAPI 补充外，全部功能离线可用。"
version: "v1.0.1"
author: "Whereis-Alice"
repo: "https://github.com/Whereis-Alice/astrbot_plugin_pokemon_partner"
homepage: ""
license: "MIT"
tags:
  - "宝可梦"
  - "pokemon"
  - "抽卡"
  - "图鉴"
  - "游戏"
astrbot_version: ">=4.16,<5"
features:
  - "今日宝可梦：每次固定数量、四档稀有度概率、SSR 保底、新伙伴保底、冷却与每日次数全部可配置"
  - "收藏与养成：图鉴进度、闪光个体、重复折算星尘、星尘定向兑换、收集里程碑奖励与群排行"
  - "主题卡片：抽卡结果、收藏图鉴、训练家资料、概率说明、图鉴详情与许愿星结果，Pillow 渲染"
  - "本地中文图鉴查询：编号/名称/形态名，1025 种族 + 295 形态"
  - "LLM 原子工具：图鉴、特性、招式、道具、性格、相性、克制、配招、对战、队伍、冠军赛与伙伴系统"
  - "能力值与对战：官方公式、25 种性格、简化回合制模拟（可复现种子）"
  - "冠军赛数据：排名/配置/道具反查/跨赛季趋势，本地 SQLite 只读，独立脚本抓取"
  - "可配置关闭 PokéAPI；关闭后纯离线运行"
keywords:
  - pokemon
  - 宝可梦
  - 抽卡
  - 图鉴
  - 对战模拟
  - 冠军赛
